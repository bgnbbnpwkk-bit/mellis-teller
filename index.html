*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F4EEE2; --surface:#FFFDF8; --card:#FFFFFF;
  --ink:#2D2A24; --muted:#9A9081; --line:#EAE2D2;
  --green:#557A5C; --green-d:#3E5E45; --green-soft:#E5EEE3;
  --terra:#C2724E; --amber:#D6A23E; --blue:#6E8FB2;
}
body{
  font-family:'Nunito Sans',sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased;
  background:radial-gradient(1200px 500px at 110% -10%, #EBE3D0 0%, rgba(235,227,208,0) 55%),radial-gradient(900px 500px at -10% 110%, #E7EEE0 0%, rgba(231,238,224,0) 55%),var(--bg);
  min-height:100vh;
}
.mt-wrap{max-width:560px;margin:0 auto;padding:22px 16px 120px}
.mt-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.mt-title{font-family:'Fraunces',serif;font-weight:600;font-size:26px;letter-spacing:-.5px;line-height:1}
.mt-title small{display:block;font-family:'Nunito Sans';font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.mt-icon-btn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.mt-head-actions{display:flex;align-items:center;gap:9px}
.mt-info-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mt-info-btn:hover{color:var(--green-d);border-color:var(--green)}
.mt-info-sec{margin:14px 0}
.mt-info-h{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:6px}
.mt-info-list{margin:0;padding-left:18px;font-size:13px;font-weight:600;color:var(--ink);line-height:1.6}
.mt-info-txt{font-size:13px;font-weight:600;color:var(--muted);line-height:1.5}
.mt-datebar{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 10px;margin-bottom:16px}
.mt-datebar>button{border:none;background:transparent;cursor:pointer;font-size:20px;color:var(--green-d);width:38px;height:38px;border-radius:11px}
.mt-datebar>button:hover{background:var(--green-soft)}
.mt-date-center{display:flex;flex-direction:column;align-items:center;gap:3px}
.mt-date-tap{position:relative;display:flex;align-items:center;gap:6px;cursor:pointer;padding:3px 8px;border-radius:9px}
.mt-date-tap:hover{background:var(--green-soft)}
.mt-cal-ico{font-size:13px;opacity:.85;line-height:1}
.mt-date-main{font-weight:700;font-size:15px}
.mt-date-input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:none;cursor:pointer;font-size:16px;padding:0}
.mt-date-sub{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--green)}
.mt-today-btn{border:none;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--green-d);background:var(--green-soft);padding:3px 11px;border-radius:9px;cursor:pointer}
.mt-summary{background:linear-gradient(160deg,#fff,#FFFBF2);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:18px;box-shadow:0 10px 30px -22px rgba(80,60,30,.45)}
.mt-kcal-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.mt-kcal-big{font-family:'Fraunces',serif;font-weight:600;font-size:44px;line-height:.9;letter-spacing:-1px}
.mt-kcal-big em{font-style:normal;font-size:16px;font-weight:700;color:var(--muted);font-family:'Nunito Sans'}
.mt-goal-txt{text-align:right;font-size:13px;color:var(--muted);font-weight:600;line-height:1.4}
.mt-goal-txt b{color:var(--ink)}
.mt-bar{height:9px;border-radius:9px;background:var(--green-soft);overflow:hidden;margin:16px 0 18px}
.mt-bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--green),var(--green-d))}
.mt-bar.over i{background:linear-gradient(90deg,var(--terra),#a9512f)}
.mt-macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mt-macro{background:var(--bg);border-radius:14px;padding:11px 12px}
.mt-macro .lab{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.mt-macro .dot{width:8px;height:8px;border-radius:50%}
.mt-macro .val{font-family:'Fraunces',serif;font-weight:600;font-size:20px;margin-top:4px}
.mt-macro .val em{font-style:normal;font-size:12px;color:var(--muted);font-family:'Nunito Sans';font-weight:700}
.mt-meal{margin-bottom:14px}
.mt-meal-head{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 8px}
.mt-meal-name{font-family:'Fraunces',serif;font-weight:600;font-size:18px}
.mt-meal-sum{font-size:12px;color:var(--muted);font-weight:700}
.mt-card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.mt-entry{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.mt-entry:last-child{border-bottom:none}
.mt-entry:hover{background:#FFFBF1}
.mt-entry .e-main{flex:1;min-width:0}
.mt-entry .e-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt-entry .e-sub{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.mt-entry .e-kcal{font-family:'Fraunces',serif;font-weight:600;font-size:16px;white-space:nowrap}
.mt-entry .e-kcal em{font-style:normal;font-size:11px;color:var(--muted);font-family:'Nunito Sans';font-weight:700}
.mt-add{width:100%;border:1.5px dashed var(--line);background:transparent;color:var(--green-d);font-weight:700;font-size:14px;padding:11px;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;margin-top:8px}
.mt-add:hover{border-color:var(--green);background:var(--green-soft)}
.mt-overlay{position:fixed;inset:0;background:rgba(45,38,28,.42);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.mt-sheet{width:100%;max-width:560px;background:var(--surface);border-radius:26px 26px 0 0;max-height:90vh;display:flex;flex-direction:column}
.mt-sheet-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px;border-bottom:1px solid var(--line);flex-shrink:0}
.mt-sheet-title{font-family:'Fraunces',serif;font-weight:600;font-size:20px}
.mt-x{border:none;background:var(--bg);width:34px;height:34px;border-radius:11px;font-size:17px;cursor:pointer;color:var(--ink)}
.mt-sheet-body{padding:16px 20px;overflow-y:auto}
.mt-input{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:12px 14px;font-size:16px;font-family:inherit;color:var(--ink);font-weight:600;outline:none}
.mt-input:focus{border-color:var(--green)}
.mt-input::placeholder{color:var(--muted);font-weight:600}
.mt-search-row{display:flex;gap:8px;margin-bottom:10px}
.mt-actrow{display:flex;gap:8px;margin-bottom:8px}
.mt-actrow .mt-btn{flex:1}
.mt-btn{border:none;border-radius:13px;padding:12px 14px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px}
.mt-btn-green{background:var(--green-d);color:#fff}
.mt-btn-ghost{background:var(--bg);color:var(--green-d)}
.mt-btn-full{width:100%}
.mt-res{display:flex;align-items:center;gap:10px;padding:12px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.mt-res:hover{background:#FFFBF1}
.mt-res .r-name{font-weight:700;font-size:15px}
.mt-res .r-sub{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.mt-res .r-tag{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:8px;flex-shrink:0}
.mt-tag-mine{background:var(--green-soft);color:var(--green-d)}
.mt-tag-online{background:#E7EEF5;color:var(--blue)}
.mt-section-lab{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 4px 4px}
.mt-portion-info{background:var(--bg);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:14px;line-height:1.5}
.mt-portion-info b{color:var(--ink)}
.mt-gram-wrap{display:flex;align-items:center;gap:10px}
.mt-gram-wrap .mt-input{font-size:22px;font-family:'Fraunces',serif;text-align:center}
.mt-gram-unit{font-weight:800;color:var(--muted);font-size:16px}
.mt-chips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 4px}
.mt-chip{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink)}
.mt-chip.on{background:var(--green-d);border-color:var(--green-d);color:#fff}
.mt-live{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}
.mt-live div{background:var(--bg);border-radius:12px;padding:10px 8px;text-align:center}
.mt-live .v{font-family:'Fraunces',serif;font-weight:600;font-size:18px}
.mt-live .l{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.mt-field{margin-bottom:12px}
.mt-field label{display:block;font-size:12px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.mt-grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mt-g4col{display:flex;flex-direction:column;gap:5px;min-width:0}
.mt-g4lab{font-size:10.5px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);text-align:center;white-space:nowrap}
.mt-g4col .mt-input{padding-left:6px;padding-right:6px;text-align:center}
.mt-install{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.mt-install-go{flex:1;border:none;background:var(--green-d);color:#fff;font-family:inherit;font-weight:800;font-size:14px;padding:12px 14px;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.mt-install-x{border:1px solid var(--line);background:var(--surface);color:var(--muted);width:42px;height:42px;border-radius:14px;font-size:15px;cursor:pointer;flex-shrink:0}
.mt-meal-pick{display:flex;gap:6px;flex-wrap:wrap}
.mt-toggle{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:13px;padding:11px 14px;margin:10px 0 16px;cursor:pointer}
.mt-toggle .sw{width:42px;height:24px;border-radius:14px;background:var(--line);position:relative;transition:.2s;flex-shrink:0}
.mt-toggle .sw i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.mt-toggle.on .sw{background:var(--green)}
.mt-toggle.on .sw i{left:21px}
.mt-toggle .tt{font-size:13px;font-weight:700}
.mt-toggle .tt small{display:block;color:var(--muted);font-weight:600;font-size:11px;margin-top:1px}
.mt-spin{text-align:center;padding:24px;color:var(--muted);font-weight:600;font-size:14px}
.mt-del{width:100%;border:1.5px solid #E7C4B5;background:#FBEFE9;color:#A9512f;font-weight:700;border-radius:13px;padding:12px;cursor:pointer;margin-top:10px}
.mt-note{font-size:11px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.5;font-weight:600}
.mt-photo-hint{font-size:13px;color:#5d6b58;font-weight:600;line-height:1.5;margin-bottom:12px}
.mt-reader{width:100%;border-radius:14px;overflow:hidden;background:#000;min-height:240px}
.mt-progress{height:8px;background:var(--green-soft);border-radius:8px;overflow:hidden;margin-top:10px}
.mt-progress i{display:block;height:100%;width:0;background:var(--green-d);transition:width .2s}
.mt-analyze-msg{font-size:13px;font-weight:600;color:#4a5746;background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:10px;line-height:1.5}
.mt-ocrtext{font-size:11px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:12px;max-height:110px;overflow:auto;white-space:pre-wrap;font-weight:600}
</style>

// ---------- Helfer ----------
function pad(n){return String(n).padStart(2,"0");}
function todayKey(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function shiftDay(key,delta){var a=key.split("-").map(Number);var d=new Date(a[0],a[1]-1,a[2]+delta);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function prettyDate(key){var a=key.split("-").map(Number);var d=new Date(a[0],a[1]-1,a[2]);return DAYS[d.getDay()]+", "+a[2]+". "+MONTHS[a[1]-1]+" "+a[0];}
function defaultMeal(){var h=new Date().getHours();if(h<11)return"Frühstück";if(h<15)return"Mittagessen";if(h<21)return"Abendessen";return"Snacks";}
function nowTime(){var d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes());}
function r0(x){return Math.round(x);}
function r1(x){return Math.round(x*10)/10;}
function compute(food,grams){var k=grams/100;return{kcal:r0(food.kcal*k),p:r1(food.p*k),c:r1(food.c*k),f:r1(food.f*k)};}
function parseNum(v){if(v==null)return null;var m=String(v).replace(",",".").match(/-?\d+(\.\d+)?/);return m?parseFloat(m[0]):null;}
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function escAttr(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");}

// ---------- PWA-Installation ----------
var installEvt=null;

function installHidden(){try{return sessionStorage.getItem("mt_installHidden")==="1";}catch(_){return false;}}

window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();installEvt=e;renderApp();});

// ---------- Hauptansicht ----------

  }).join("");

    '<div class="mt-head"><div class="mt-title">Mellis Teller<small>Ernährungstagebuch</small></div><div class="mt-head-actions"><button class="mt-info-btn" data-act="info" aria-label="Info zum App-Stand">i</button><button class="mt-icon-btn" data-act="settings">⚙</button></div></div>'+

    '<div class="mt-datebar"><button data-act="prev">‹</button><div class="mt-date-center"><div class="mt-date-tap"><span class="mt-cal-ico">📅</span><span class="mt-date-main">'+prettyDate(date)+'</span><input type="date" id="dateInput" class="mt-date-input" value="'+date+'"></div>'+(date===todayKey()?'<span class="mt-date-sub">Heute</span>':'<button class="mt-today-btn" data-act="today">↩ Zu Heute</button>')+'</div><button data-act="next">›</button></div>'+

    meals+
    '<div class="mt-note">Nährwerte sind ca.-Angaben je 100 g. Daten werden auf diesem Gerät gespeichert.</div>'+
  '</div>';
}

app.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]"); if(!el)return;
  var act=el.getAttribute("data-act");
  if(act==="prev")setDate(shiftDay(date,-1));
  else if(act==="next")setDate(shiftDay(date,1));
  else if(act==="today")setDate(todayKey());
  else if(act==="settings")openSettings();
  else if(act==="info")openInfo();
  else if(act==="install")doInstall();
  else if(act==="installhide"){try{sessionStorage.setItem("mt_installHidden","1");}catch(_){}renderApp();}
  else if(act==="add")openSearch(el.getAttribute("data-meal"));
  else if(act==="edit"){var id=el.getAttribute("data-id");var en=entries.find(function(x){return x.id===id;});if(en)openEdit(en);}
});

// ---------- generisches Sheet ----------
function openSheet(title,beforeClose){
  var overlay=document.createElement("div");overlay.className="mt-overlay";
  var sheet=document.createElement("div");sheet.className="mt-sheet";
  sheet.innerHTML='<div class="mt-sheet-head"><div class="mt-sheet-title">'+esc(title)+'</div><button class="mt-x">✕</button></div><div class="mt-sheet-body"></div>';
  overlay.appendChild(sheet);document.body.appendChild(overlay);
  function close(){if(beforeClose)beforeClose();overlay.remove();}
  overlay.addEventListener("click",function(e){if(e.target===overlay)close();});
  sheet.querySelector(".mt-x").addEventListener("click",close);
  return{body:sheet.querySelector(".mt-sheet-body"),close:close};
}

  function localList(){var q=input.value.trim().toLowerCase();var all=customFoods.concat(BUILTIN);return q?all.filter(function(f){return(f.name+" "+(f.brand||"")).toLowerCase().indexOf(q)!==-1;}).slice(0,40):all.slice(0,12);}
  function rowHtml(f,idx){return '<div class="mt-res" data-idx="'+idx+'"><div style="flex:1;min-width:0"><div class="r-name">'+esc(f.name)+'</div><div class="r-sub">'+f.kcal+' kcal/100 g'+(f.brand?' · '+esc(f.brand):'')+'</div></div>'+(f.builtin?'':(f.online?'<span class="r-tag mt-tag-online">online</span>':'<span class="r-tag mt-tag-mine">eigenes</span>'))+'</div>';}
  var current=[];

    searchOnline(q).then(function(list){if(!list.length){results.innerHTML='<div class="mt-portion-info">Keine Online-Treffer mit Nährwerten gefunden.</div>';return;}show(list,"Online-Treffer");}).catch(function(){results.innerHTML='<div class="mt-portion-info">Online-Suche nicht erreichbar.</div>';});
  });

// ---------- Portion ----------
function openEdit(entry){var food={name:entry.name,brand:entry.brand||"",kcal:entry.base.kcal,p:entry.base.p,c:entry.base.c,f:entry.base.f,serving:entry.grams};openPortion(food,{meal:entry.meal,editingId:entry.id,grams:entry.grams});}
function openPortion(food,opts){
  opts=opts||{};var editingId=opts.editingId||null;var grams=opts.grams!=null?opts.grams:(food.serving||100);var mealSel=opts.meal||defaultMeal();var remember=false;
  var s=openSheet(editingId?"Bearbeiten":"Portion"),body=s.body,close=s.close;
  function updateLive(){var live=compute(food,Number(grams)||0);var cells=body.querySelectorAll(".mt-live .v");if(cells.length===4){cells[0].textContent=live.kcal;cells[1].textContent=live.p;cells[2].textContent=live.c;cells[3].textContent=live.f;}}
  function commit(){var g=Number(grams);if(!g||g<=0)return;var nutr=compute(food,g);var base={kcal:food.kcal,p:food.p,c:food.c,f:food.f};var prev=editingId?entries.find(function(x){return x.id===editingId;}):null;var entry={id:editingId||"e"+Date.now(),name:food.name,brand:food.brand||"",grams:g,meal:mealSel,time:prev?(prev.time||nowTime()):nowTime(),base:base,kcal:nutr.kcal,p:nutr.p,c:nutr.c,f:nutr.f};if(editingId)entries=entries.map(function(e){return e.id===editingId?entry:e;});else entries=entries.concat([entry]);saveEntries();if(remember&&!editingId){var exists=customFoods.some(function(c){return c.name.toLowerCase()===food.name.toLowerCase();});if(!exists){customFoods=[{id:"c"+Date.now(),name:food.name,brand:food.brand||"",kcal:food.kcal,p:food.p,c:food.c,f:food.f,serving:g,builtin:false}].concat(customFoods);saveCustom();}}close();renderApp();}
  function render(){
    var live=compute(food,Number(grams)||0);
    var chips=(food.serving?'<button class="mt-chip" data-g="'+food.serving+'">1 Portion ('+food.serving+' g)</button>':'')+[10,30,50,100,150,200].map(function(g){return '<button class="mt-chip'+(Number(grams)===g?" on":"")+'" data-g="'+g+'">'+g+' g</button>';}).join("");
    body.innerHTML='<div class="mt-portion-info"><b>'+esc(food.name)+'</b>'+(food.brand?' · '+esc(food.brand):'')+'<br>je 100 g: '+food.kcal+' kcal · '+food.p+' g E · '+food.c+' g KH · '+food.f+' g F</div>'+
      '<div class="mt-field"><label>Menge frei eingeben</label><div class="mt-gram-wrap"><input class="mt-input" id="pg" type="number" inputmode="decimal" value="'+grams+'"><span class="mt-gram-unit">Gramm</span></div></div>'+
      '<div class="mt-chips" id="chips">'+chips+'</div>'+
      '<div class="mt-live"><div><div class="v">'+live.kcal+'</div><div class="l">kcal</div></div><div><div class="v">'+live.p+'</div><div class="l">Eiweiß</div></div><div><div class="v">'+live.c+'</div><div class="l">KH</div></div><div><div class="v">'+live.f+'</div><div class="l">Fett</div></div></div>'+
      '<div class="mt-field"><label>Mahlzeit</label><div class="mt-meal-pick" id="meals">'+MEALS.map(function(m){return '<button class="mt-chip'+(mealSel===m?" on":"")+'" data-m="'+m+'">'+m+'</button>';}).join("")+'</div></div>'+
      (editingId?"":'<div class="mt-toggle'+(remember?" on":"")+'" id="rem"><div class="sw"><i></i></div><div class="tt">Produkt merken<small>Erscheint künftig direkt in der Liste</small></div></div>')+
      '<button class="mt-btn mt-btn-green mt-btn-full" id="padd" style="padding:14px">'+(editingId?"Speichern":"Zum Tagebuch hinzufügen")+'</button>'+
      (editingId?'<button class="mt-del" id="pdel">Eintrag löschen</button>':'');
    var pg=body.querySelector("#pg");pg.addEventListener("input",function(){grams=pg.value;updateLive();});
    body.querySelector("#chips").addEventListener("click",function(e){var b=e.target.closest("[data-g]");if(!b)return;grams=Number(b.getAttribute("data-g"));render();});
    body.querySelector("#meals").addEventListener("click",function(e){var b=e.target.closest("[data-m]");if(!b)return;mealSel=b.getAttribute("data-m");render();});
    var rem=body.querySelector("#rem");if(rem)rem.addEventListener("click",function(){remember=!remember;render();});
    body.querySelector("#padd").addEventListener("click",commit);
    var del=body.querySelector("#pdel");if(del)del.addEventListener("click",function(){entries=entries.filter(function(e){return e.id!==editingId;});saveEntries();close();renderApp();});
  }
  render();
}

    var name=body.querySelector("#cName").value.trim();var kcal=Number(body.querySelector("#cKcal").value);
    if(!name||isNaN(kcal)){body.querySelector("#cName").style.borderColor="var(--terra)";return;}
    var food={id:"c"+Date.now(),name:name,brand:body.querySelector("#cBrand").value.trim(),kcal:kcal,p:Number(body.querySelector("#cP").value)||0,c:Number(body.querySelector("#cC").value)||0,f:Number(body.querySelector("#cF").value)||0,serving:Number(body.querySelector("#cS").value)||100,builtin:false};
    customFoods=[food].concat(customFoods);saveCustom();close();openPortion(food,{meal:meal});
  });
  setTimeout(function(){var n=body.querySelector("#cName");if(n&&!n.value)n.focus();},60);
}

// ---------- Online (Open Food Facts) ----------
function mapProduct(p){var nu=p.nutriments||{};var kcal=nu["energy-kcal_100g"];if(kcal==null&&nu["energy_100g"]!=null)kcal=nu["energy_100g"]/4.184;if(kcal==null||isNaN(kcal))return null;return{id:"o"+Math.random().toString(36).slice(2),name:(p.product_name_de||p.product_name||"").trim(),brand:(p.brands||"").split(",")[0].trim(),kcal:r1(kcal),p:r1(nu["proteins_100g"]||0),c:r1(nu["carbohydrates_100g"]||0),f:r1(nu["fat_100g"]||0),serving:Number(p.serving_quantity)||100,online:true};}
function searchOnline(q){
  var url="https://world.openfoodfacts.org/cgi/search.pl?search_terms="+encodeURIComponent(q)+"&search_simple=1&action=process&json=1&page_size=30&fields=product_name,product_name_de,brands,nutriments,serving_quantity";
  var ctrl=new AbortController();var t=setTimeout(function(){ctrl.abort();},9000);
  return fetch(url,{signal:ctrl.signal}).then(function(r){clearTimeout(t);return r.json();}).then(function(d){return(d.products||[]).map(mapProduct).filter(function(x){return x&&x.name;}).slice(0,25);});
}
function lookupBarcode(code){
  var url="https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(code)+".json?fields=product_name,product_name_de,brands,nutriments,serving_quantity";
  return fetch(url).then(function(r){return r.json();}).then(function(d){if(d.status!==1||!d.product)return null;var f=mapProduct(d.product);if(f&&!f.name)f.name="Produkt "+code;return f;});
}

// ---------- Barcode-Scanner (ZXing) ----------
function openScanner(meal){
  var reader=null,stopped=false;
  function stop(){if(reader&&!stopped){stopped=true;try{reader.reset();}catch(e){}}}
  var s=openSheet("Barcode scannen",stop),body=s.body,close=s.close;
  if(typeof ZXing==="undefined"){body.innerHTML='<div class="mt-analyze-msg">Der Scanner konnte nicht geladen werden (Verbindung beim Öffnen?). Bitte Seite neu laden.</div>';return;}
  body.innerHTML='<div class="mt-photo-hint">Halte den Strichcode waagerecht und möglichst formatfüllend in den Rahmen. Bitte Kamera-Zugriff erlauben.</div>'+
    '<div class="mt-reader"><video id="zxvid" style="width:100%;height:300px;object-fit:cover;display:block" muted playsinline></video></div>'+
    '<div id="scanmsg" class="mt-analyze-msg" style="display:none"></div>'+
    '<button class="mt-btn mt-btn-ghost mt-btn-full" id="scanFile" style="margin-top:10px">Stattdessen Foto vom Barcode wählen</button>'+
    '<input type="file" accept="image/*" id="scanFileInput" hidden>';
  var msg=body.querySelector("#scanmsg");var video=body.querySelector("#zxvid");
  var hints=new Map();
  try{hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E,ZXing.BarcodeFormat.CODE_128]);hints.set(ZXing.DecodeHintType.TRY_HARDER,true);}catch(e){}
  function found(food,code){if(food){close();openCustom(food,meal);}else{msg.style.display="block";msg.textContent="Kein Treffer in der Datenbank für "+code+". Du kannst es per „Tabelle\" oder von Hand anlegen.";}}
  function handleCode(text){stop();msg.style.display="block";msg.textContent="Code "+text+" – suche Produkt …";lookupBarcode(text).then(function(f){found(f,text);}).catch(function(){msg.textContent="Datenbank nicht erreichbar.";});}
  try{
    reader=new ZXing.BrowserMultiFormatReader(hints);
    var startPromise;
    if(reader.decodeFromConstraints){startPromise=reader.decodeFromConstraints({video:{facingMode:{ideal:"environment"}}},video,function(result){if(result&&!stopped)handleCode(result.getText());});}
    else{startPromise=reader.decodeFromVideoDevice(undefined,video,function(result){if(result&&!stopped)handleCode(result.getText());});}
    if(startPromise&&startPromise.catch)startPromise.catch(function(){msg.style.display="block";msg.textContent="Kamera nicht verfügbar. Bitte den Foto-Knopf unten nutzen.";});
  }catch(e){msg.style.display="block";msg.textContent="Scanner-Fehler. Bitte den Foto-Knopf nutzen.";}
  var fi=body.querySelector("#scanFileInput");
  body.querySelector("#scanFile").addEventListener("click",function(){fi.click();});
  fi.addEventListener("change",function(){
    var f=fi.files[0];if(!f)return;stop();msg.style.display="block";msg.textContent="Barcode wird gelesen …";
    var url=URL.createObjectURL(f);var r2=new ZXing.BrowserMultiFormatReader(hints);
    r2.decodeFromImageUrl(url).then(function(result){URL.revokeObjectURL(url);var text=result.getText();msg.textContent="Code "+text+" – suche Produkt …";return lookupBarcode(text).then(function(food){found(food,text);});}).catch(function(){URL.revokeObjectURL(url);msg.textContent="Konnte keinen Barcode im Foto erkennen. Tipp: nah heran, gerade halten, gute Beleuchtung.";});
  });
}

// ---------- OCR der Nährwert-Tabelle ----------
function downscale(file,max){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){var img=new Image();img.onload=function(){var w=img.width,h=img.height;if(w>max||h>max){var k=Math.min(max/w,max/h);w=Math.round(w*k);h=Math.round(h*k);}var c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);res(c.toDataURL("image/jpeg",0.85));};img.onerror=rej;img.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});}
function parseNutritionText(text){
  var t=text.replace(/\u00a0/g," ");
  function near(words){var re=new RegExp("(?:"+words+")[^0-9]{0,18}(\\d+[.,]?\\d*)","i");var m=t.match(re);return m?parseNum(m[1]):null;}
  var kcal=null;var mk=t.match(/(\d+[.,]?\d*)\s*kcal/i);if(mk)kcal=parseNum(mk[1]);if(kcal==null)kcal=near("kcal|energie|brennwert");
  return{kcal:kcal,f:near("fett|fat"),c:near("kohlenhydrate|kohlenhydr|carb"),p:near("eiwei|protein")};
}
function openOCR(meal){
  var s=openSheet("Nährwert-Tabelle fotografieren"),body=s.body,close=s.close;
  if(typeof Tesseract==="undefined"){body.innerHTML='<div class="mt-analyze-msg">Die Texterkennung konnte nicht geladen werden (keine Verbindung beim Öffnen?). Bitte Seite neu laden.</div>';return;}
  body.innerHTML='<div class="mt-photo-hint">Mach ein scharfes, gerades Foto – am besten nur die Nährwert-Tabelle. Die Erkennung läuft direkt auf dem Gerät (erster Start lädt einmalig die Sprachdaten).</div>'+
    '<label class="mt-btn mt-btn-green mt-btn-full" style="cursor:pointer">📷 Foto aufnehmen / wählen<input type="file" accept="image/*" capture="environment" id="ocrFile" hidden></label>'+
    '<div id="ocrProg" style="display:none"><div class="mt-photo-hint" id="ocrStatus" style="margin:12px 0 0">Wird vorbereitet …</div><div class="mt-progress"><i id="ocrBar"></i></div></div>';
  body.querySelector("#ocrFile").addEventListener("change",function(){
    var f=this.files[0];if(!f)return;
    body.querySelector("#ocrProg").style.display="block";
    var bar=body.querySelector("#ocrBar"),status=body.querySelector("#ocrStatus");
    status.textContent="Bild wird gelesen …";
    downscale(f,1600).then(function(durl){
      return Tesseract.recognize(durl,"deu",{logger:function(m){if(m.status==="recognizing text"){bar.style.width=Math.round(m.progress*100)+"%";status.textContent="Erkenne Text … "+Math.round(m.progress*100)+"%";}}});
    }).then(function(out){
      var text=out&&out.data?out.data.text:"";var v=parseNutritionText(text);close();openCustom({name:"",brand:"",kcal:v.kcal,p:v.p,c:v.c,f:v.f,serving:"",_ocr:text},meal);
    }).catch(function(err){status.textContent="OCR fehlgeschlagen: "+((err&&err.message)?err.message:"unbekannt");});
  });
}

// ---------- Einstellungen ----------
function openSettings(){
  var s=openSheet("Einstellungen"),body=s.body,close=s.close;
  body.innerHTML='<div class="mt-field"><label>Tagesziel Kalorien (optional)</label><input class="mt-input" id="gi" type="number" inputmode="decimal" value="'+(goal?goal:"")+'" placeholder="z. B. 2000 – oder leer"></div><div class="mt-portion-info">Ohne Eingabe zeigt die App nur die Summen, ohne Vorgabe.</div><button class="mt-btn mt-btn-green mt-btn-full" id="gs" style="padding:14px">Speichern</button>';
  body.querySelector("#gs").addEventListener("click",function(){var v=body.querySelector("#gi").value.trim();goal=v===""?null:Number(v);LS.set("mt_goal",goal==null?"":String(goal));close();renderApp();});
}

// ---------- Info & App-Stand ----------
function openInfo(){
  var s=openSheet("Info & App-Stand"),body=s.body;
  var changes=APP_CHANGES.map(function(c){return '<li>'+esc(c)+'</li>';}).join("");
  body.innerHTML=
    '<div class="mt-portion-info">App-Stand <b>'+esc(APP_VERSION)+'</b><br>Mellis Teller · persönliches Ernährungstagebuch</div>'+
    '<div class="mt-info-sec"><div class="mt-info-h">Zuletzt geändert</div><ul class="mt-info-list">'+changes+'</ul></div>'+
    '<div class="mt-info-sec"><div class="mt-info-h">Daten &amp; Aktualisierung</div><div class="mt-info-txt">Deine Einträge liegen nur auf diesem Gerät (localStorage). Die App aktualisiert sich automatisch – ein manuelles Neu-Laden ist nicht nötig.</div></div>'+
    '<div class="mt-info-sec"><div class="mt-info-h">Als App installieren</div>'+
      (isStandalone()
        ?'<div class="mt-info-txt">Läuft bereits als installierte App ✓</div>'
        :(installEvt
          ?'<button class="mt-btn mt-btn-green mt-btn-full" id="infoInstall" style="padding:13px">📲 Jetzt installieren</button>'
          :'<div class="mt-info-txt">Über das Browser-Menü (⋮ bzw. das Teilen-Symbol) „Zum Startbildschirm hinzufügen" bzw. „App installieren" wählen.</div>'))+
    '</div>'+
    '<button class="mt-btn mt-btn-ghost mt-btn-full" id="ckupd" style="margin-top:4px">Jetzt auf Updates prüfen</button>'+
    '<div id="ckmsg" class="mt-analyze-msg" style="display:none"></div>';
  var infoInstall=body.querySelector("#infoInstall");
  if(infoInstall)infoInstall.addEventListener("click",function(){s.close();doInstall();});
  var msg=body.querySelector("#ckmsg");
  body.querySelector("#ckupd").addEventListener("click",function(){
    msg.style.display="block";msg.textContent="Prüfe …";
    checkForUpdate().then(function(res){
      if(!res||res.error)msg.textContent="Konnte gerade nicht prüfen (keine Verbindung?).";
      else if(res.updated)msg.textContent="Neuer Stand gefunden – wird geladen …";
      else msg.textContent="Du hast den neuesten Stand ("+APP_VERSION+").";
    });
  });
}

// ---------- Automatische Aktualisierung (kein Hard-Reload nötig) ----------
// Holt die live deployte Seite cache-frei, vergleicht die Version und lädt bei
// einem neuen Stand genau einmal cache-bustend neu.
function checkForUpdate(){
  var path=location.pathname;
  return fetch(path+"?_uc="+Date.now(),{cache:"no-store"}).then(function(r){return r.text();}).then(function(html){
    var m=html.match(/APP_VERSION\s*=\s*"([^"]+)"/);
    var remote=m?m[1]:null;
    if(remote&&remote!==APP_VERSION){
      var key="mt_reloadedFor";
      var done=null;try{done=sessionStorage.getItem(key);}catch(e){}
      if(done!==remote){
        try{sessionStorage.setItem(key,remote);}catch(e){}
        location.replace(path+"?v="+encodeURIComponent(remote));
        return {updated:true,remote:remote};
      }
    }
    return {updated:false,remote:remote};
  }).catch(function(){return {error:true};});
}
document.addEventListener("visibilitychange",function(){if(!document.hidden)checkForUpdate();});

// ---------- Service Worker (macht die App auf Android installierbar) ----------
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});
}

// ---------- Start ----------
load();renderApp();checkForUpdate();
})();
